[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "pdf2md"
version = "0.1.2"
description = "Convert PDF slides to Markdown"
requires-python = ">=3.10"
dependencies = [
    "pymupdf",
    "pymupdf4llm"
]


[project.scripts]
pdf2md = "pdf2md.cli:main"


[tool.setuptools.packages.find]
where = ["src"]